exclude_dirs:
  - ".git"
  - ".idea"
  - ".vscode"
  - "__pycache__"
  - "node_modules"
  - "build"
  - "dist"
  - "venv"
  - ".venv"
  - "docs"
  - "html"
  - "htmlcov"
  - "env"
  - "vendor"
  - "testdata"
  - "fixtures"

scan_extensions:
  - ".py"
  - ".c"
  - ".h"
  - ".cpp"
  - ".go"
  - ".java"
  - ".js"
  - ".ts"
  - ".php"
  - ".rb"
  - ".sh"
  - ".yaml"
  - ".yml"
  - ".json"
  - ".ini"
  - ".cfg"
  - ".conf"
  - ".env"
  - "Makefile"
  - "requirements.txt"
  - "new_key"
  - "credentials"
  - ".env.local"
  - ".env.production"
  - "secrets"
  - ".netrc"
  - ".npmrc"
  - "docker-compose.yml"