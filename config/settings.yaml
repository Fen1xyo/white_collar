exclude_dirs:
  - ".git"
  - ".idea"
  - ".vscode"
  - "__pycache__"
  - "node_modules"
  - "build"
  - "dist"
  - "venv"
  - ".venv"
  - "env"

scan_extensions:
  - ".py"
  - ".c"
  - ".h"
  - ".cpp"
  - ".go"
  - ".java"
  - ".js"
  - ".ts"
  - ".php"
  - ".rb"
  - ".sh"
  - ".yaml"
  - ".yml"
  - ".json"
  - ".ini"
  - ".cfg"
  - ".conf"
  - ".env"
  - "Makefile"
  - "requirements.txt"
  - "docker-compose.yml"
