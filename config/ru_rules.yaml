# =============================================================================
# all_rules.yaml
# Единый файл со всеми правилами сканера секретов.
# Содержит: универсальные правила + российские сервисы (59 правил).
# =============================================================================

rules:

  - id: GENERIC_KEYWORD_SECRET_12
    name: "Generic Secret by Keyword (12+ chars)"
    # Ищет любое слово-ключ (key, token, password, secret, auth, oauth и т.д.) в имени переменной,
    # которой присваивается любая строка длиной 12 и более символов.
    pattern: '(?i)(key|secret|token|password|passwd|auth|oauth|credential|bearer)\w*\s*[:=]\s*["'']([a-zA-Z0-9\-_!@#$%^&*()]{12,})["'']'
    severity: MEDIUM
    description: "Обнаружена потенциальная утечка: переменная с 'секретным' именем содержит строку длиной 12+ символов."
    remediation: "Проверьте, является ли эта строка чувствительной. Если да, переместите ее в переменные окружения или секрет-менеджер."

  - id: GENERIC_KEYWORD_SECRET_20
    name: "Generic Secret by Keyword (20+ chars)"
    # То же самое, но для строк длиной 20+ символов. Более высокая критичность.
    pattern: '(?i)(key|secret|token|password|passwd|auth|oauth|credential|bearer)\w*\s*[:=]\s*["'']([a-zA-Z0-9\-_!@#$%^&*()]{20,})["'']'
    severity: HIGH
    description: "Обнаружена потенциальная утечка: переменная с 'секретным' именем содержит длинную строку (20+ символов)."
    remediation: "Проверьте, является ли эта строка чувствительной. Если да, переместите ее в переменные окружения или секрет-менеджер."
  # ===========================================================================
  # УНИВЕРСАЛЬНЫЕ ПРАВИЛА
  # ===========================================================================

  - id: AWS_ACCESS_KEY
    name: "AWS Access Key ID"
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: CRITICAL
    description: "Обнаружен AWS Access Key ID. Этот ключ является частью учетных данных AWS и может предоставить доступ к ресурсам облака."
    remediation: "Немедленно отозвать ключ в консоли AWS IAM. Для аутентификации приложений использовать IAM-роли или переменные окружения."

  - id: GITHUB_TOKEN
    name: "GitHub Token"
    pattern: 'ghp_[a-zA-Z0-9]{36}'
    severity: CRITICAL
    description: "Обнаружен персональный токен доступа (PAT) GitHub."
    remediation: "Немедленно отозвать токен в настройках профиля GitHub (Settings → Developer settings → Personal access tokens). Храните токены в секрет-менеджерах."

  - id: GENERIC_API_KEY
    name: "Generic API Key"
    # Первая группа незахватывающая — match.group(1) всегда возвращает значение ключа
    pattern: '(?i)(?:api_key|apikey|api-key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружен ключ API общего вида. Такие ключи часто используются для доступа к различным сервисам."
    remediation: "Проверьте, является ли этот ключ чувствительным. Если да, переместите его в переменные окружения или секрет-менеджер (например, HashiCorp Vault, AWS Secrets Manager)."

  - id: PRIVATE_KEY
    name: "Private Key"
    pattern: '-----BEGIN (?:EC|RSA|DSA|PGP) PRIVATE KEY-----'
    severity: CRITICAL
    description: "Обнаружен приватный ключ в формате PEM. Компрометация приватного ключа может привести к расшифровке трафика или несанкционированному доступу по SSH."
    remediation: "Никогда не храните приватные ключи в репозиториях. Немедленно отозвите скомпрометированный ключ и перевыпустите пару ключей."

  - id: STRIPE_SECRET_KEY
    name: "Stripe Secret Key"
    pattern: 'sk_live_[a-zA-Z0-9]{24,}'
    severity: CRITICAL
    description: "Обнаружен секретный ключ Stripe. Позволяет проводить платежи и получать доступ к финансовым данным."
    remediation: "Немедленно отозвать ключ в Dashboard Stripe → Developers → API keys."

  - id: STRIPE_RESTRICTED_KEY
    name: "Stripe Restricted Key"
    pattern: 'rk_live_[a-zA-Z0-9]{24,}'
    severity: HIGH
    description: "Обнаружен ограниченный ключ Stripe."
    remediation: "Отозвать ключ в Dashboard Stripe → Developers → Restricted keys."

  - id: SLACK_TOKEN
    name: "Slack Token"
    pattern: 'xox[baprs]-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}'
    severity: HIGH
    description: "Обнаружен токен Slack. Позволяет отправлять сообщения и управлять рабочим пространством."
    remediation: "Отзовите токен на api.slack.com → Your Apps → OAuth & Permissions."

  - id: SLACK_WEBHOOK
    name: "Slack Incoming Webhook"
    pattern: 'https://hooks\.slack\.com/services/T[a-zA-Z0-9]{8}/B[a-zA-Z0-9]{8,}/[a-zA-Z0-9]{24}'
    severity: HIGH
    description: "Обнаружен входящий вебхук Slack. Позволяет отправлять сообщения в канал."
    remediation: "Удалите вебхук в настройках Slack App → Incoming Webhooks."

  - id: GOOGLE_API_KEY
    name: "Google API Key"
    pattern: 'AIza[0-9A-Za-z\-_]{35}'
    severity: HIGH
    description: "Обнаружен Google API Key. Может предоставить доступ к сервисам Google Cloud, Maps и другим."
    remediation: "Отзовите ключ в Google Cloud Console → APIs & Services → Credentials."

  - id: GOOGLE_OAUTH_TOKEN
    name: "Google OAuth Access Token"
    pattern: 'ya29\.[0-9A-Za-z\-_]{68,}'
    severity: CRITICAL
    description: "Обнаружен Google OAuth Access Token. Предоставляет временный доступ к Google-сервисам от имени пользователя."
    remediation: "Отзовите токен через myaccount.google.com → Security → Third-party apps."

  - id: GITLAB_TOKEN
    name: "GitLab Personal Access Token"
    pattern: 'glpat-[a-zA-Z0-9\-_]{20}'
    severity: CRITICAL
    description: "Обнаружен Personal Access Token GitLab."
    remediation: "Отзовите токен в GitLab → User Settings → Access Tokens."

  - id: HEROKU_API_KEY
    name: "Heroku API Key"
    pattern: '[h|H][e|E][r|R][o|O][k|K][u|U][_\-]?[a|A][p|P][i|I][_\-]?[k|K][e|E][y|Y]\s*[:=]\s*["\x27]?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен API-ключ Heroku. Позволяет управлять приложениями и инфраструктурой."
    remediation: "Сбросьте ключ в настройках аккаунта Heroku → Account → API Key."

  - id: SENDGRID_API_KEY
    name: "SendGrid API Key"
    pattern: 'SG\.[a-zA-Z0-9\-_]{22}\.[a-zA-Z0-9\-_]{43}'
    severity: HIGH
    description: "Обнаружен API-ключ SendGrid. Позволяет отправлять email-рассылки."
    remediation: "Отзовите ключ в SendGrid → Settings → API Keys."

  - id: TWILIO_ACCOUNT_SID
    name: "Twilio Account SID"
    pattern: 'AC[a-zA-Z0-9]{32}'
    severity: HIGH
    description: "Обнаружен Twilio Account SID."
    remediation: "Смените Auth Token в консоли Twilio. SID сам по себе не является секретом, но вместе с Auth Token даёт полный доступ."

  - id: TWILIO_AUTH_TOKEN
    name: "Twilio Auth Token"
    pattern: '(?i)twilio[_\-]?auth[_\-]?token\s*[:=]\s*["\x27]?([a-zA-Z0-9]{32})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен Twilio Auth Token. Даёт полный доступ к аккаунту Twilio."
    remediation: "Немедленно смените Auth Token в консоли Twilio."

  - id: MAILGUN_API_KEY
    name: "Mailgun API Key"
    pattern: 'key-[a-zA-Z0-9]{32}'
    severity: HIGH
    description: "Обнаружен API-ключ Mailgun. Позволяет отправлять email и управлять доменами."
    remediation: "Отзовите ключ в Mailgun → Account → API Keys."

  - id: FIREBASE_SERVER_KEY
    name: "Firebase Server Key"
    pattern: 'AAAA[a-zA-Z0-9\-_]{7}:[a-zA-Z0-9\-_]{140}'
    severity: CRITICAL
    description: "Обнаружен Firebase Server Key. Позволяет отправлять push-уведомления от имени приложения."
    remediation: "Пересоздайте ключ в Firebase Console → Project Settings → Cloud Messaging."

  - id: SQUARE_ACCESS_TOKEN
    name: "Square Access Token"
    pattern: 'sq0atp-[a-zA-Z0-9\-_]{22}'
    severity: CRITICAL
    description: "Обнаружен токен Square. Позволяет проводить платежи через Square API."
    remediation: "Отзовите токен в Square Developer Dashboard → OAuth."

  - id: PAYPAL_CLIENT_SECRET
    name: "PayPal Client Secret"
    pattern: '(?i)paypal[_\-]?(?:client[_\-]?secret|secret|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9\-_]{32,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен Client Secret PayPal. Позволяет выполнять платежные операции."
    remediation: "Пересоздайте учётные данные в PayPal Developer Dashboard."

  - id: DIGITALOCEAN_TOKEN
    name: "DigitalOcean Personal Access Token"
    pattern: 'dop_v1_[a-f0-9]{64}'
    severity: CRITICAL
    description: "Обнаружен Personal Access Token DigitalOcean. Позволяет управлять дроплетами и инфраструктурой."
    remediation: "Отзовите токен в DigitalOcean → Account → API → Tokens."

  - id: AZURE_CLIENT_SECRET
    name: "Azure Client Secret"
    pattern: '(?i)azure[_\-]?(?:client[_\-]?secret|tenant[_\-]?id|subscription[_\-]?id|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9~._\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружены учётные данные Azure. Могут предоставить доступ к ресурсам Microsoft Azure."
    remediation: "Пересоздайте секрет в Azure Active Directory → App Registrations → Certificates & secrets."

  - id: GITHUB_APP_TOKEN
    name: "GitHub App Token"
    pattern: '(?:ghs|ghu|ghr)_[a-zA-Z0-9]{36}'
    severity: CRITICAL
    description: "Обнаружен токен GitHub App (server-to-server, user-to-server или refresh)."
    remediation: "Немедленно отзовите токен в настройках GitHub App."

  - id: NPM_TOKEN
    name: "NPM Token"
    pattern: 'npm_[a-zA-Z0-9]{36}'
    severity: HIGH
    description: "Обнаружен токен NPM. Позволяет публиковать пакеты и управлять аккаунтом."
    remediation: "Отзовите токен на npmjs.com → Access Tokens."

  - id: DOCKER_HUB_TOKEN
    name: "Docker Hub Access Token"
    pattern: '(?i)(?:docker[_\-]?(?:hub[_\-]?)?|dockerhub[_\-]?)(?:token|password|pat|access[_\-]?token)\s*[:=]\s*["\x27]?([a-zA-Z0-9\-_\.]{20,})["\x27]?'
    severity: HIGH
    description: "Обнаружен токен Docker Hub. Позволяет пушить образы в реестр."
    remediation: "Отзовите токен на hub.docker.com → Account Settings → Security."

  - id: GENERIC_PASSWORD
    name: "Generic Password in Code"
    pattern: '(?i)(?:password|passwd|pwd)\s*[:=]\s*["\x27]([^"\x27\s]{8,})["\x27]'
    severity: HIGH
    description: "Обнаружен пароль, захардкоженный в коде. Это нарушение базовых требований безопасности."
    remediation: "Перенесите пароль в переменные окружения или секрет-менеджер. Не храните пароли в репозиториях."

  - id: GENERIC_SECRET
    name: "Generic Secret"
    pattern: '(?i)(?:secret|client_secret|app_secret)\s*[:=]\s*["\x27]([a-zA-Z0-9_\-!@#$%^&*]{12,})["\x27]'
    severity: HIGH
    description: "Обнаружен хардкод секрета общего вида."
    remediation: "Перенесите секрет в переменные окружения или секрет-менеджер."

  - id: BASIC_AUTH_IN_URL
    name: "Basic Auth Credentials in URL"
    pattern: 'https?://[^:\s]{3,}:[^@\s]{3,}@[a-zA-Z0-9.\-]+'
    severity: CRITICAL
    description: "Обнаружены учётные данные Basic Auth в URL. Пароль передаётся в открытом виде и сохраняется в логах."
    remediation: "Уберите учётные данные из URL. Используйте переменные окружения или файлы конфигурации."

  # ===========================================================================
  # YANDEX CLOUD
  # ===========================================================================

  - id: YANDEX_CLOUD_IAM_TOKEN
    name: "Yandex Cloud IAM Token"
    # Реальные IAM-токены имеют точки внутри тела: t1.<сегмент>.<сегмент>
    pattern: 't1\.[A-Za-z0-9_\-\.]{150,}'
    severity: CRITICAL
    description: "Обнаружен Yandex Cloud IAM-токен. Это короткоживущий токен для аутентификации в Yandex Cloud."
    remediation: >
      IAM-токены живут максимум 12 часов. Если токен старше — возможно, он уже истёк,
      но его следует отозвать. Используйте сервисный аккаунт и авторизованные ключи
      для долгоживущих процессов.

  - id: YANDEX_CLOUD_API_KEY
    name: "Yandex Cloud API Key"
    pattern: '(?:AQVN|AQVJ)[A-Za-z0-9_\-]{35,}'
    severity: CRITICAL
    description: "Обнаружен статический API-ключ сервисного аккаунта Yandex Cloud."
    remediation: >
      Немедленно отзовите ключ в консоли Yandex Cloud: IAM → Сервисные аккаунты →
      [ваш аккаунт] → API-ключи. Создайте новый и передавайте через переменную
      окружения или секрет в Yandex Lockbox.

  - id: YANDEX_LOCKBOX_SECRET
    name: "Yandex Lockbox Secret ID"
    # ID секретов Yandex Lockbox начинаются с e6q
    pattern: '(?i)(?:lockbox|yandex[_\-]?lockbox)[_\-]?(?:secret[_\-]?id|key|value)\s*[:=]\s*["\x27]?(e6q[a-zA-Z0-9]{15,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен ID секрета Yandex Lockbox. Может использоваться для получения сохранённых секретов из хранилища."
    remediation: "Отзовите доступ к секрету в консоли Yandex Cloud → Lockbox."

  - id: YANDEX_MAPS_API_KEY
    name: "Yandex Maps API Key"
    pattern: '(?i)(?:yandex[_\-]?maps?|ymaps?)[_\-]?(?:api[_\-]?key|key|token)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{30,})["\x27]?'
    severity: HIGH
    description: "Обнаружен ключ Яндекс Карт. Злоупотребление ключом может привести к расходам."
    remediation: "Перегенерируйте ключ в консоли Яндекс Облака. Ограничьте доступ по домену/IP."

  - id: YANDEX_METRIKA_TOKEN
    name: "Yandex Metrika OAuth Token"
    pattern: '(?i)(?:metrika|metrica|yandex[_\-]?metrika)[_\-]?(?:token|oauth|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{32,})["\x27]?'
    severity: HIGH
    description: "Обнаружен OAuth-токен Яндекс.Метрики. Даёт доступ к статистике и настройкам счётчиков."
    remediation: "Отзовите токен на oauth.yandex.ru → Приложения."

  - id: YANDEX_MARKET_API_TOKEN
    name: "Yandex Market / Direct API Token"
    pattern: '(?i)(?:yandex[_\-]?(?:market|direct)|market[_\-]?api)[_\-]?(?:token|oauth|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{32,})["\x27]?'
    severity: HIGH
    description: "Обнаружен OAuth-токен Яндекс.Маркет или Яндекс.Директ."
    remediation: "Отзовите токен на oauth.yandex.ru → Мои приложения."

  - id: APPMETRICA_API_KEY
    name: "AppMetrica API Key"
    pattern: '(?i)(?:appmetrica|app[_\-]?metrica)[_\-]?(?:api[_\-]?key|token|oauth)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{32,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ AppMetrica."
    remediation: "Отзовите ключ в настройках AppMetrica → Доступ → API-ключи."

  # ===========================================================================
  # VK / TELEGRAM / BITRIX
  # ===========================================================================

  - id: VK_API_TOKEN
    name: "VK API Access Token"
    pattern: 'vk1\.a\.[A-Za-z0-9_\-]{80,}'
    severity: HIGH
    description: "Обнаружен токен доступа VK API. Может использоваться для выполнения действий от имени пользователя или сообщества."
    remediation: >
      Отзовите токен через VK ID → Безопасность. Для серверных приложений используйте
      сервисный ключ (service_token), а не пользовательский.

  - id: TELEGRAM_BOT_TOKEN
    name: "Telegram Bot API Token"
    pattern: '\d{8,10}:AA[A-Za-z0-9_\-]{33}'
    severity: CRITICAL
    description: "Обнаружен токен Telegram Bot API. Позволяет полностью контролировать бота."
    remediation: >
      Немедленно отзовите токен командой /revoke у @BotFather.
      Передавайте токен через переменную окружения.

  - id: BITRIX_WEBHOOK
    name: "1C-Bitrix Webhook URL"
    pattern: 'https://[a-zA-Z0-9.\-]+\.bitrix24\.ru/rest/\d+/([a-z0-9]{32,})'
    severity: HIGH
    description: "Обнаружен URL входящего вебхука 1C-Bitrix24 с токеном. Позволяет отправлять данные в ваш портал Bitrix24."
    remediation: >
      Удалите вебхук в настройках портала Bitrix24 (Разработчикам → Входящие webhook).
      Создайте новый и передавайте его URL через переменную окружения.

  - id: BITRIX24_OAUTH_TOKEN
    name: "Bitrix24 OAuth Access Token"
    pattern: '(?i)(?:bitrix24|bitrix)[_\-]?(?:access[_\-]?token|oauth[_\-]?token|token)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{40,})["\x27]?'
    severity: HIGH
    description: "Обнаружен OAuth-токен Bitrix24. Позволяет выполнять операции в CRM от имени пользователя."
    remediation: "Отзовите приложение в Bitrix24 → Профиль → Разрешения приложений."

  # ===========================================================================
  # РОССИЙСКИЕ ОБЛАЧНЫЕ ПРОВАЙДЕРЫ
  # ===========================================================================

  - id: SELECTEL_API_TOKEN
    name: "Selectel API Token"
    pattern: '(?i)selectel[_\-]?(?:token|api[_\-]?key|secret|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен токен Selectel. Может предоставить доступ к объектному хранилищу и серверам."
    remediation: "Отзовите токен в панели управления Selectel → Профиль → Токены."

  - id: VK_CLOUD_TOKEN
    name: "VK Cloud Token"
    pattern: '(?i)(?:vk[_\-]?cloud|mcs|mail[_\-]?cloud)[_\-]?(?:token|api[_\-]?key|secret|access[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружены учётные данные VK Cloud (Mail.ru Cloud Solutions / MCS)."
    remediation: "Удалите ключ в консоли VK Cloud → IAM → Сервисные пользователи."

  - id: TIMEWEB_CLOUD_TOKEN
    name: "Timeweb Cloud API Token"
    pattern: '(?i)timeweb[_\-]?(?:token|api[_\-]?key|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{20,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-токен Timeweb Cloud."
    remediation: "Отзовите токен в личном кабинете Timeweb → API → Токены."

  - id: BEGET_API_KEY
    name: "Beget API Key"
    pattern: '(?i)beget[_\-]?(?:api[_\-]?key|token|secret|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ хостинга Beget."
    remediation: "Сбросьте ключ в личном кабинете Beget → Настройки → API."

  - id: REGRU_API_KEY
    name: "Reg.ru API Key"
    pattern: '(?i)(?:reg[_\-]?ru|regru)[_\-]?(?:api[_\-]?key|token|secret|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-@\.]{10,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ Reg.ru. Позволяет управлять доменами, хостингом и DNS."
    remediation: "Отзовите ключ в личном кабинете Reg.ru → Настройки API."

  - id: CROC_CLOUD_TOKEN
    name: "CROC Cloud API Token"
