# config/ru_rules.yaml
# Правила для российских сервисов + универсальные generic-правила.
rules:
  # ===========================================================================
  # GENERIC — общие правила по ключевым словам
  # ===========================================================================
  - id: SHORT_PASSWORD_LIKE
    name: "Short or Numeric Password"
    # Ищет короткие (6+ символов) значения, присвоенные переменным с именами, похожими на "пароль".
    pattern: >-
      (?i)(?:password|passwd|pwd|pswd|psswrd|pas|passw|pwrd|pasword|possword|passward|pass-ward|pass-word)\w*\s*[:=]\s*["']?([a-zA-Z0-9\-_!@#$%^&*()\/+]{6,})["']?
    severity: MEDIUM
    description: "Обнаружено короткое (6+ символов) значение, присвоенное переменной, имя которой похоже на 'пароль'. Это может быть слабый или тестовый пароль."
    remediation: "Проверьте, является ли эта строка чувствительной. Избегайте использования слабых или легко угадываемых паролей, даже в тестовом коде. Используйте менеджеры секретов."

  - id: GENERIC_KEYWORD_SECRET_12
    name: "Generic Secret by Keyword (12+ chars)"
    pattern: >-
      (?i)(?:key|secret|token|password|passwd|auth|oauth|credential|bearer)\w*\s*[:=]\s*["']?([a-zA-Z0-9\-_!@#$%^&*()]{12,})["']?
    severity: MEDIUM
    description: "Обнаружена потенциальная утечка: переменная с 'секретным' именем содержит строку длиной 12+ символов."
    remediation: "Проверьте, является ли эта строка чувствительной. Если да, переместите ее в переменные окружения или секрет-менеджер."

  - id: GENERIC_KEYWORD_SECRET_20
    name: "Generic Secret by Keyword (20+ chars)"
    pattern: >-
      (?i)(?:key|secret|token|password|passwd|auth|oauth|credential|bearer)\w*\s*[:=]\s*["']?([a-zA-Z0-9\-_!@#$%^&*()]{20,})["']?
    severity: HIGH
    description: "Обнаружена потенциальная утечка: переменная с 'секретным' именем содержит длинную строку (20+ символов)."
    remediation: "Проверьте, является ли эта строка чувствительной. Если да, переместите ее в переменные окружения или секрет-менеджер."

  # ===========================================================================
  # YANDEX CLOUD
  # ===========================================================================
  - id: YANDEX_CLOUD_IAM_TOKEN
    name: "Yandex Cloud IAM Token"
    pattern: 't1\.[A-Za-z0-9_\-\.]{150,}'
    severity: CRITICAL
    description: "Обнаружен Yandex Cloud IAM-токен. Короткоживущий токен для аутентификации в Yandex Cloud."
    remediation: >
      IAM-токены живут максимум 12 часов. Если токен старше — возможно, уже истёк,
      но его следует отозвать. Используйте сервисный аккаунт и авторизованные ключи
      для долгоживущих процессов.

  - id: YANDEX_CLOUD_API_KEY
    name: "Yandex Cloud API Key"
    pattern: '(?:AQVN|AQVJ)[A-Za-z0-9_\-]{35,}'
    severity: CRITICAL
    description: "Обнаружен статический API-ключ сервисного аккаунта Yandex Cloud."
    remediation: >
      Немедленно отзовите ключ в консоли Yandex Cloud: IAM → Сервисные аккаунты →
      [ваш аккаунт] → API-ключи. Создайте новый и передавайте через переменную
      окружения или секрет в Yandex Lockbox.

  # ... и так далее, вставьте сюда все остальные правила из вашего оригинального файла ...


  - id: YANDEX_LOCKBOX_SECRET
    name: "Yandex Lockbox Secret ID"
    pattern: '(?i)(?:lockbox|yandex[_\-]?lockbox)[_\-]?(?:secret[_\-]?id|key|value)\s*[:=]\s*["\x27]?(e6q[a-zA-Z0-9]{15,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен ID секрета Yandex Lockbox."
    remediation: "Отзовите доступ к секрету в консоли Yandex Cloud → Lockbox."

  - id: YANDEX_MAPS_API_KEY
    name: "Yandex Maps API Key"
    pattern: '(?i)(?:yandex[_\-]?maps?|ymaps?)[_\-]?(?:api[_\-]?key|key|token)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{30,})["\x27]?'
    severity: HIGH
    description: "Обнаружен ключ Яндекс Карт. Злоупотребление может привести к расходам."
    remediation: "Перегенерируйте ключ в консоли Яндекс Облака. Ограничьте доступ по домену/IP."

  - id: YANDEX_METRIKA_TOKEN
    name: "Yandex Metrika OAuth Token"
    pattern: '(?i)(?:metrika|metrica|yandex[_\-]?metrika)[_\-]?(?:token|oauth|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{32,})["\x27]?'
    severity: HIGH
    description: "Обнаружен OAuth-токен Яндекс.Метрики."
    remediation: "Отзовите токен на oauth.yandex.ru → Приложения."

  - id: YANDEX_MARKET_API_TOKEN
    name: "Yandex Market / Direct API Token"
    pattern: '(?i)(?:yandex[_\-]?(?:market|direct)|market[_\-]?api)[_\-]?(?:token|oauth|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{32,})["\x27]?'
    severity: HIGH
    description: "Обнаружен OAuth-токен Яндекс.Маркет или Яндекс.Директ."
    remediation: "Отзовите токен на oauth.yandex.ru → Мои приложения."

  - id: APPMETRICA_API_KEY
    name: "AppMetrica API Key"
    pattern: '(?i)(?:appmetrica|app[_\-]?metrica)[_\-]?(?:api[_\-]?key|token|oauth)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{32,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ AppMetrica."
    remediation: "Отзовите ключ в настройках AppMetrica → Доступ → API-ключи."

  # ===========================================================================
  # VK / TELEGRAM / BITRIX
  # ===========================================================================

  - id: VK_API_TOKEN
    name: "VK API Access Token"
    pattern: 'vk1\.a\.[A-Za-z0-9_\-]{80,}'
    severity: HIGH
    description: "Обнаружен токен доступа VK API."
    remediation: >
      Отзовите токен через VK ID → Безопасность. Для серверных приложений используйте
      сервисный ключ (service_token), а не пользовательский.

  - id: TELEGRAM_BOT_TOKEN
    name: "Telegram Bot API Token"
    pattern: '\d{8,10}:AA[A-Za-z0-9_\-]{33}'
    severity: CRITICAL
    description: "Обнаружен токен Telegram Bot API. Позволяет полностью контролировать бота."
    remediation: >
      Немедленно отзовите токен командой /revoke у @BotFather.
      Передавайте токен через переменную окружения.

  - id: BITRIX_WEBHOOK
    name: "1C-Bitrix Webhook URL"
    pattern: 'https://[a-zA-Z0-9.\-]+\.bitrix24\.ru/rest/\d+/([a-z0-9]{32,})'
    severity: HIGH
    description: "Обнаружен URL входящего вебхука 1C-Bitrix24 с токеном."
    remediation: >
      Удалите вебхук в настройках портала Bitrix24 (Разработчикам → Входящие webhook).
      Создайте новый и передавайте его URL через переменную окружения.

  - id: BITRIX24_OAUTH_TOKEN
    name: "Bitrix24 OAuth Access Token"
    pattern: '(?i)(?:bitrix24|bitrix)[_\-]?(?:access[_\-]?token|oauth[_\-]?token|token)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{40,})["\x27]?'
    severity: HIGH
    description: "Обнаружен OAuth-токен Bitrix24."
    remediation: "Отзовите приложение в Bitrix24 → Профиль → Разрешения приложений."

  # ===========================================================================
  # РОССИЙСКИЕ ОБЛАЧНЫЕ ПРОВАЙДЕРЫ
  # ===========================================================================

  - id: SELECTEL_API_TOKEN
    name: "Selectel API Token"
    pattern: '(?i)selectel[_\-]?(?:token|api[_\-]?key|secret|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен токен Selectel."
    remediation: "Отзовите токен в панели управления Selectel → Профиль → Токены."

  - id: VK_CLOUD_TOKEN
    name: "VK Cloud Token"
    pattern: '(?i)(?:vk[_\-]?cloud|mcs|mail[_\-]?cloud)[_\-]?(?:token|api[_\-]?key|secret|access[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружены учётные данные VK Cloud (Mail.ru Cloud Solutions / MCS)."
    remediation: "Удалите ключ в консоли VK Cloud → IAM → Сервисные пользователи."

  - id: TIMEWEB_CLOUD_TOKEN
    name: "Timeweb Cloud API Token"
    pattern: '(?i)timeweb[_\-]?(?:token|api[_\-]?key|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{20,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-токен Timeweb Cloud."
    remediation: "Отзовите токен в личном кабинете Timeweb → API → Токены."

  - id: BEGET_API_KEY
    name: "Beget API Key"
    pattern: '(?i)beget[_\-]?(?:api[_\-]?key|token|secret|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ хостинга Beget."
    remediation: "Сбросьте ключ в личном кабинете Beget → Настройки → API."

  - id: REGRU_API_KEY
    name: "Reg.ru API Key"
    pattern: '(?i)(?:reg[_\-]?ru|regru)[_\-]?(?:api[_\-]?key|token|secret|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-@\.]{10,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ Reg.ru."
    remediation: "Отзовите ключ в личном кабинете Reg.ru → Настройки API."

  - id: CROC_CLOUD_TOKEN
    name: "CROC Cloud API Token"
    pattern: '(?i)(?:croc[_\-]?cloud|croc)[_\-]?(?:token|api[_\-]?key|secret|access[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен токен CROC Cloud."
    remediation: "Немедленно обратитесь в службу поддержки CROC и отзовите скомпрометированный ключ."

  - id: SBERCLOUD_TOKEN
    name: "SberCloud API Token"
    pattern: '(?i)(?:sber[_\-]?cloud|sbercloud)[_\-]?(?:token|api[_\-]?key|secret|ak|sk)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{20,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен токен SberCloud."
    remediation: "Отзовите ключ в консоли SberCloud → IAM."

  - id: ISPMANAGER_API_KEY
    name: "ISPmanager API Key"
    pattern: '(?i)(?:ispmanager|isp[_\-]?manager|ispsystem)[_\-]?(?:api[_\-]?key|key|token|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-@\.]{8,})["\x27]?'
    severity: HIGH
    description: "Обнаружены учётные данные ISPmanager."
    remediation: "Смените пароль и отзовите ключ в панели ISPmanager → Пользователи."

  # ===========================================================================
  # ПЛАТЁЖНЫЕ СИСТЕМЫ (РОССИЯ)
  # ===========================================================================

  - id: YOOMONEY_SECRET_KEY
    name: "YooMoney (ЮМани) Secret Key"
    pattern: '(?i)(?:yoomoney|yoo[_\-]?money|yamoney|ya[_\-]?money)[_\-]?(?:secret|token|key|api[_\-]?key|oauth)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен секретный ключ ЮМани."
    remediation: "Отзовите токен в настройках магазина ЮМани."

  - id: YOOKASSA_SECRET_KEY
    name: "YooKassa (ЮКасса) Secret Key"
    pattern: '(?:live|test)_[a-zA-Z0-9_\-:]{20,}'
    severity: CRITICAL
    description: "Обнаружен секретный ключ ЮКасса. Позволяет проводить и отменять платежи."
    remediation: "Немедленно отзовите ключ в личном кабинете ЮКасса."

  - id: TINKOFF_SECRET_KEY
    name: "Tinkoff (T-Bank) Terminal Key"
    pattern: '(?i)(?:tinkoff|tbank|t[_\-]?bank)[_\-]?(?:secret[_\-]?key|terminal[_\-]?key|password|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{8,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен секретный ключ терминала Тинькофф/Т-Банк."
    remediation: "Заблокируйте терминал и сгенерируйте новый ключ в личном кабинете Тинькофф Эквайринг."

  - id: QIWI_API_TOKEN
    name: "QIWI API Token"
    pattern: '(?i)qiwi[_\-]?(?:token|api[_\-]?key|p2p[_\-]?key|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{32,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен API-токен QIWI."
    remediation: "Заблокируйте токен на сайте qiwi.com → Настройки → API."

  - id: CLOUDPAYMENTS_API_KEY
    name: "CloudPayments API Key"
    pattern: '(?i)(?:cloudpayments|cloud[_\-]?payments)[_\-]?(?:api[_\-]?(?:key|secret|password)|public[_\-]?id)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен ключ CloudPayments."
    remediation: "Отзовите ключ в личном кабинете CloudPayments → Настройки → Ключи API."

  - id: ROBOKASSA_MERCHANT_PASSWORD
    name: "Robokassa Merchant Password"
    pattern: '(?i)robokassa[_\-]?(?:password[12]?|mrh[_\-]?pass|merchant[_\-]?pass)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-!@#$%]{8,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен пароль магазина Robokassa."
    remediation: "Немедленно смените пароль в личном кабинете Robokassa → Технические настройки."

  - id: SBERBANK_MERCHANT_TOKEN
    name: "Sberbank Acquiring Token"
    pattern: '(?i)(?:sberbank|sber)[_\-]?(?:token|api[_\-]?key|merchant[_\-]?(?:login|password)|acquiring)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружены учётные данные Sberbank Ecommerce."
    remediation: "Обратитесь в службу поддержки Сбербанка для блокировки и перевыпуска ключей."

  - id: ALFA_BANK_TOKEN
    name: "Alfa-Bank Acquiring Token"
    pattern: '(?i)(?:alfa[_\-]?bank|alfabank)[_\-]?(?:token|api[_\-]?key|merchant[_\-]?(?:login|password))\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-@\.]{8,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружены учётные данные интернет-эквайринга Альфа-Банка."
    remediation: "Заблокируйте учётные данные через службу поддержки Альфа-Банка."

  - id: PAYMASTER_SECRET
    name: "PayMaster Secret Key"
    pattern: '(?i)paymaster[_\-]?(?:secret|api[_\-]?key|password|hmac)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружен секретный ключ PayMaster."
    remediation: "Сбросьте ключ в личном кабинете PayMaster → Настройки магазина."

  - id: MODULBANK_API_KEY
    name: "МодульБанк API Key"
    pattern: '(?i)(?:modulbank|modul[_\-]?bank)[_\-]?(?:api[_\-]?key|token|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{32,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен API-ключ МодульБанка."
    remediation: "Немедленно отзовите ключ в интернет-банке МодульБанка."

  - id: TOCHKA_BANK_API_KEY
    name: "Точка Банк API Key"
    pattern: '(?i)(?:tochka|точка)[_\-]?(?:api[_\-]?key|token|secret|client[_\-]?id)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен API-ключ Точка Банка."
    remediation: "Отзовите ключ через поддержку Точка Банка."

  - id: LIQPAY_PRIVATE_KEY
    name: "LiqPay Private Key"
    pattern: '(?i)liqpay[_\-]?(?:private[_\-]?key|secret|api[_\-]?key)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен приватный ключ LiqPay."
    remediation: "Пересоздайте ключи в личном кабинете LiqPay → Бизнес → Мерчанты."

  # ===========================================================================
  # SMS-ШЛЮЗЫ И ТЕЛЕКОМ
  # ===========================================================================

  - id: SMSRU_API_ID
    name: "SMS.ru API ID"
    pattern: '(?i)(?:sms[_\-]?ru|smsru)[_\-]?(?:api[_\-]?id|key|token)\s*[:=]\s*["\x27]?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["\x27]?'
    severity: HIGH
    description: "Обнаружен API ID сервиса SMS.ru (UUID-формат)."
    remediation: "Сгенерируйте новый API ID в личном кабинете SMS.ru → Настройки API."

  - id: SMSC_CREDENTIALS
    name: "SMSC.ru Credentials"
    pattern: '(?i)smsc[_\-]?(?:login|password|api[_\-]?key|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-@\.]{6,})["\x27]?'
    severity: HIGH
    description: "Обнаружены учётные данные SMSC.ru."
    remediation: "Смените пароль в личном кабинете SMSC.ru и отзовите API-ключи."

  - id: SMSAERO_API_KEY
    name: "SmsAero API Key"
    pattern: '(?i)(?:smsaero|sms[_\-]?aero)[_\-]?(?:api[_\-]?key|key|token|password)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ SmsAero."
    remediation: "Отзовите ключ в личном кабинете SmsAero → Интеграция → API."

  - id: MTS_EXOLVE_API_KEY
    name: "MTS Exolve API Key"
    pattern: '(?i)(?:mts[_\-]?exolve|exolve|mts[_\-]?api)[_\-]?(?:api[_\-]?key|token|secret)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{20,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ MTS Exolve."
    remediation: "Отзовите ключ в личном кабинете MTS Exolve."

  - id: DEVINO_API_KEY
    name: "Devino Telecom API Key"
    pattern: '(?i)devino[_\-]?(?:api[_\-]?key|token|login|password|session[_\-]?id)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружены учётные данные Devino Telecom."
    remediation: "Смените пароль и отзовите сессионный ключ в личном кабинете Devino."

  # ===========================================================================
  # КАРТЫ И ГЕОСЕРВИСЫ
  # ===========================================================================

  - id: TWOGIS_API_KEY
    name: "2GIS API Key"
    pattern: '(?i)(?:twogis|2gis)[_\-]?(?:api[_\-]?key|key|token)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-]{16,})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ 2GIS."
    remediation: "Отзовите ключ в личном кабинете 2GIS API → Мои ключи."

  # ===========================================================================
  # ДАННЫЕ И ЭДО
  # ===========================================================================

  - id: DADATA_API_KEY
    name: "DaData API Key"
    pattern: '(?i)dadata[_\-]?(?:api[_\-]?key|key|token|secret)\s*[:=]\s*["\x27]?([a-f0-9]{40})["\x27]?'
    severity: HIGH
    description: "Обнаружен API-ключ DaData (hex, 40 символов)."
    remediation: "Сбросьте ключ в личном кабинете DaData → Кабинет → API-ключи."

  - id: DIADOC_API_KEY
    name: "Kontur Diadoc API Key"
    pattern: '(?i)(?:diadoc|диадок)[_\-]?(?:api[_\-]?key|key|token|client[_\-]?id)\s*[:=]\s*["\x27]?([a-zA-Z0-9_\-\.]{16,})["\x27]?'
    severity: CRITICAL
    description: "Обнаружен API-ключ Диадок (СКБ Контур)."
    remediation: "Отзовите ключ в личном кабинете Диадок → Настройки → API-ключи."

  - id: KONTUR_EXTERN_API_KEY
